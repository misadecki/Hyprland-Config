# This file was generated by Qt Creator and will be overwritten unless you remove this line.
Hover:
  ShowAKA: Yes
Diagnostics:
  UnusedIncludes: Strict
CompileFlags:
  Add:
    - "-xc"
    - "-std=gnu11"
    - "-Ibuild/zephyr/include/generated"
  Remove:
  - -fno-reorder-functions
  - -fno-freestanding
  - -mno-fdpic
  - -mfp16-format=ieee
  - -fno-printf-return-value
